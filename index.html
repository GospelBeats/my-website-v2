<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Gospel Beats APP</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" type="image/png" href="/img/fav.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="bgArt" class="bgArt"></div>
  <header class="topbar">
    <!-- <div class="brand">
      <div class="dot"></div> -->
      <div class="brand">
      <div><a href="https://www.gospelbeats.com"><img src="img/gb-logo-wht_250.png" width="200" height="50"></a></div>
      <div>
        <div class="brandTitle">MUSIC APP</div>
        <div class="brandSub" id="libStatus">Loading library…</div>
        <div id="iosInstallHint" class="iosInstallHint hidden">Install this app: Tap Share → Add to Home Screen.</div>
      </div>
    </div>
    <button id="btnInstall" class="ghost hidden"><span style="color: #be1e2d">&#x2B07; </span>Install</button>
  </header>

  <main class="layout">
    <section class="panel" id="albumsPanel">
      <div class="panelHeader">
        <h2>Albums</h2>
        <input id="search" type="search" placeholder="Search…" autocomplete="off" />
      </div>
      <div id="categoryBar" class="categoryBar"></div>
      <div id="albums" class="albums"></div>
    </section>

    <section class="panel" id="queuePanel">
      <div class="panelHeader">
        <h2>Queue</h2>
        <div class="modes">
          <button id="btnShuffle" class="chip" aria-pressed="false">Shuffle</button>
          <button id="btnRepeat" class="chip" data-mode="off" aria-pressed="false">Repeat: Off</button>
        </div>
      </div>
      <ol id="queue" class="queue"></ol>
    </section>
  </main>

  <footer class="player">
    <div class="now">
      <img id="cover" class="cover" alt="cover art" />
      <div class="meta">
        <div class="titleRow">
          <div id="title" class="title">—</div>
          <div id="waveform" class="waveform paused">
            <span></span><span></span><span></span>
          </div>
        </div>
        <div id="artist" class="artist">—</div>
      </div>
    </div>

    <div class="controls">
      <button id="btnPrev" class="btn">⏮</button>
      <button id="btnPlay" class="btn big">▶</button>
      <button id="btnNext" class="btn">⏭</button>
      <button id="btnShare" class="ghost" style="font-size: 12px">Share Song</button>
    </div>

    <div class="timeline">
      <span id="curTime" class="time">0:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0" />
      <span id="durTime" class="time">0:00</span>
    </div>

    <div class="bottomRow">
      <label class="vol">
        <span>Volume</span>
        <input id="volume" type="range" min="0" max="1" step="0.01" value="1" />
      </label>
      <span id="hint" class="hint"></span>
    </div>
  </footer>

  <audio id="audio" preload="metadata" crossorigin="anonymous"></audio>

  <script src="/app.js" type="module"></script>
</body>
</html>
